<div class="container py-4 pb-5" id="mainContent">
  <div class="skeleton mb-3" style="height:2rem;max-width:420px"></div>
  <div class="skeleton mb-4" style="height:1rem;max-width:320px"></div>
  <div class="skeleton" style="height:360px"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const params = new URLSearchParams(location.search);
const VIDEO_ID = params.get('video_id') || '';
const REF = params.get('ref') || '';

let USD_TO_IDR = 17000;
let currentUser = null;
let currentVideo = null;
let paymentOptions = null;
const fmtIdr = new Intl.NumberFormat('id-ID');

function esc(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function showPayAlert(type, msg) {
  const el = document.getElementById('payAlert');
  if (!el) return;
  el.className = `alert alert-${type}`;
  el.textContent = msg;
}

(async function initUserBar() {
  try {
    const j = await fetch('/api/me').then(r => r.json());
    const el = document.getElementById('userbar');
    if (j.ok && j.user) {
      currentUser = j.user;
      el.innerHTML = `<b>${esc(j.user.username)}</b> &lt;${esc(j.user.email)}&gt;`;
    } else {
      el.innerHTML = `<a href="/public/auth/login.html" class="text-white">Sign In</a>`;
    }
  } catch {}
})();

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/auth/logout', { method:'POST' }).catch(() => {});
  location.href = '/public/auth/login.html?status=ok';
});

if (!VIDEO_ID) {
  document.getElementById('mainContent').innerHTML = '<p class="text-danger">No video specified. <a href="/public/browse.html">Browse videos</a></p>';
} else {
  init();
}

async function init() {
  try {
    const k = await fetch('/api/kurs').then(r => r.json());
    if (k.usd_to_idr) USD_TO_IDR = k.usd_to_idr;
  } catch {}

  try {
    const videosResp = await fetch('/api/videos').then(r => r.json());
    const videos = Array.isArray(videosResp.videos) ? videosResp.videos : [];
    currentVideo = videos.find(v => String(v.id) === VIDEO_ID) || null;
    if (!currentVideo) throw new Error('Video not found');
  } catch (err) {
    document.getElementById('mainContent').innerHTML = `<p class="text-danger">Error loading video: ${esc(String(err))}</p>`;
    return;
  }

  try {
    paymentOptions = await fetch('/api/pay/all_options?' + new URLSearchParams({ video_id: VIDEO_ID })).then(r => r.json());
  } catch {
    paymentOptions = null;
  }

  let playResp = null;
  try {
    const resp = await fetch('/api/request_play?' + new URLSearchParams({ video_id: VIDEO_ID }));
    playResp = await resp.json();
  } catch {}

  renderPage(playResp);
}

function renderPage(playResp) {
  const video = currentVideo;
  const priceCents = video.price_cents || 0;
  const priceUsd = (priceCents / 100).toFixed(2);
  const priceIdr = 'Rp ' + fmtIdr.format(Math.round(priceCents / 100 * USD_TO_IDR));
  const affiliateEnabled = !!(paymentOptions && paymentOptions.ok && paymentOptions.video_id);
  const hasAccess = !!(playResp && playResp.ok && playResp.playlist);

  let html = `
    <div class="mb-3">
      <a href="/public/browse.html" class="text-body-secondary text-decoration-none small">Back to Browse</a>
    </div>
    <h1 class="fs-4 fw-bold mb-1">${esc(video.title)}</h1>
    <p class="text-body-secondary small mb-2">
      by <strong>${esc(video.owner_name || '-')}</strong>
      ${priceCents > 0 ? ` | <span class="fw-semibold text-primary">$${priceUsd} (${priceIdr})</span>` : '<span class="badge bg-success">Free</span>'}
      ${REF ? ` | <span class="badge bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle">ref ${esc(REF)}</span>` : ''}
    </p>
  `;

  if (affiliateEnabled && REF) {
    html += `<div class="alert alert-info py-2 small mb-4">This visit includes affiliate referral code <strong>${esc(REF)}</strong>.</div>`;
  }

  html += hasAccess ? renderPlayer(playResp.playlist) : renderLocked(priceUsd, priceIdr);

  if (video.description) {
    html += `<div class="card shadow-sm mt-4"><div class="card-body"><h6 class="fw-semibold mb-2">About this video</h6><p class="mb-0 small text-body-secondary">${esc(video.description)}</p></div></div>`;
  }

  document.getElementById('mainContent').innerHTML = html;

  if (hasAccess) {
    startPlayer(playResp.playlist);
  } else {
    bindLockedState();
  }
}

function renderPlayer(playlistUrl) {
  return `
    <div class="ratio ratio-16x9 rounded overflow-hidden bg-black mb-3 shadow">
      <video id="hlsPlayer" controls playsinline class="w-100 h-100" data-playlist="${esc(playlistUrl)}"></video>
    </div>`;
}

function startPlayer(playlistUrl) {
  const player = document.getElementById('hlsPlayer');
  if (!player) return;
  const src = playlistUrl;
  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(src);
    hls.attachMedia(player);
  } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
    player.src = src;
  } else {
    player.parentElement.innerHTML = '<p class="text-warning p-4">Your browser does not support HLS playback.</p>';
  }
}

function renderLocked(priceUsd, priceIdr) {
  return `
    <div class="ratio ratio-16x9 rounded overflow-hidden bg-black mb-4 shadow d-flex align-items-center justify-content-center">
      <div class="text-center text-white p-4">
        <div class="fs-2 fw-bold">Locked</div>
        <div class="mt-2">Purchase this video to unlock playback.</div>
        <div class="text-secondary small">$${esc(priceUsd)} | ${esc(priceIdr)}</div>
      </div>
    </div>
    <div class="card shadow-sm mb-4">
      <div class="card-header fw-semibold">Unlock This Video</div>
      <div class="card-body">
        <div id="payAlert" class="d-none mb-3"></div>
        <div id="lockedSummary" class="small text-body-secondary mb-3"></div>
        <ul class="nav nav-tabs flex-nowrap overflow-auto text-nowrap mb-3" id="payTabs"></ul>
        <div id="payPanels"></div>
      </div>
    </div>`;
}

async function bindLockedState() {
  const summary = document.getElementById('lockedSummary');
  if (!currentUser) {
    summary.innerHTML = `You need to <a href="/public/auth/login.html">sign in</a> before buying or viewing this video.`;
  } else if (paymentOptions?.already_purchased) {
    summary.textContent = 'Your purchase is already recorded. Reload the page if playback has not started yet.';
  } else {
    summary.textContent = 'Choose one of the enabled payment methods below.';
  }

  const tabs = [];
  const panels = [];

  if (paymentOptions?.wallet?.available) {
    tabs.push(`<li class="nav-item"><button class="nav-link active" data-pay="wallet" onclick="switchPay('wallet')">Wallet</button></li>`);
    panels.push(`
      <div id="pay-wallet">
        <p class="small text-body-secondary">Instant purchase using your platform wallet balance.</p>
        <div class="mb-2 small">Price: <strong>${esc(paymentOptions.price_display || '-')}</strong> · Balance: <strong>${esc(paymentOptions.wallet.balance_display || '-') }</strong></div>
        ${paymentOptions.wallet.can_afford === false ? `<div class="alert alert-warning small py-2">Your balance is not enough for this video. <a href="/public/wallet.html">Top up your wallet</a> first.</div>` : ''}
        <button class="btn btn-primary col-12 col-sm-auto" onclick="payWallet()" ${paymentOptions.wallet.can_afford === false ? 'disabled' : ''}>Pay with Wallet</button>
      </div>
    `);
  }

  if (paymentOptions?.x402?.available) {
    tabs.push(`<li class="nav-item"><button class="nav-link ${tabs.length ? '' : 'active'}" data-pay="x402" onclick="switchPay('x402')">Blockchain x402</button></li>`);
    const tokens = Array.isArray(paymentOptions.x402.tokens) ? paymentOptions.x402.tokens : [];
    panels.push(`
      <div id="pay-x402" class="${tabs[0].includes('wallet') ? 'd-none' : ''}">
        <p class="small text-body-secondary">Pay onchain from a browser wallet (MetaMask or compatible). The contract splits the payment between the creator and the platform automatically.</p>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="x402Token" class="form-label">Token</label>
            <select id="x402Token" class="form-select" onchange="updateX402Amount()">
              ${tokens.map((token, index) => `<option value="${index}">${esc(token.symbol)} on ${esc(token.chain)} (chain ${esc(token.chain_id)})</option>`).join('')}
            </select>
          </div>
          <div class="col-md-6">
            <label for="x402Payer" class="form-label">Your Wallet Address</label>
            <div class="input-group">
              <input id="x402Payer" class="form-control font-monospace" placeholder="0x..." readonly>
              <button class="btn btn-outline-secondary" type="button" onclick="connectWallet()">Connect Wallet</button>
            </div>
          </div>
          <div class="col-12">
            <div class="small">You will pay: <strong id="x402Amount">-</strong> <span class="text-body-secondary">+ network gas</span></div>
          </div>
          <div class="col-12">
            <button id="x402PayBtn" class="btn btn-primary col-12 col-sm-auto" onclick="payX402()">Pay with Crypto Wallet</button>
          </div>
        </div>
        <div id="x402Instructions" class="mt-3 d-none p-3 rounded border bg-body-tertiary small"></div>
      </div>
    `);
  }

  if (paymentOptions?.fiat?.available) {
    tabs.push(`<li class="nav-item"><button class="nav-link ${tabs.length ? '' : 'active'}" data-pay="fiat" onclick="switchPay('fiat')">Payment Gateway</button></li>`);
    const providers = Array.isArray(paymentOptions.fiat.providers) ? paymentOptions.fiat.providers : [];
    panels.push(`
      <div id="pay-fiat" class="${tabs.length > 1 ? 'd-none' : ''}">
        <p class="small text-body-secondary">Create a hosted invoice using one of the enabled providers. The amount shown is exactly what the provider will charge.</p>
        <div class="d-grid d-sm-flex flex-wrap gap-2">
          ${providers.map(provider => {
            const charge = paymentOptions.fiat.charges?.[provider];
            return `<button class="btn btn-outline-primary" data-provider="${esc(provider)}" onclick="startProviderPayment(this.dataset.provider)">${esc(provider)}${charge?.display ? ` <span class="badge text-bg-secondary ms-1">${esc(charge.display)}</span>` : ''}</button>`;
          }).join('')}
        </div>
        <div id="fiatInfo" class="small text-body-secondary mt-3"></div>
      </div>
    `);
  }

  if (!tabs.length) {
    document.getElementById('payTabs').outerHTML = '<div class="alert alert-warning mb-0">No payment method is currently enabled for this video.</div>';
    document.getElementById('payPanels').innerHTML = '';
  } else {
    document.getElementById('payTabs').innerHTML = tabs.join('');
    document.getElementById('payPanels').innerHTML = panels.join('');
    updateX402Amount();
    resumePendingX402();
  }

  try {
    const profile = await fetch('/api/user_profile?' + new URLSearchParams({ user_id: currentVideo.owner_id })).then(r => r.json());
    const info = document.getElementById('fiatInfo');
    if (info && profile.ok && profile.profile) {
      const p = profile.profile;
      info.innerHTML = `
        Creator profile:
        <div>Username: <code>${esc(p.username)}</code></div>
        ${p.profile_desc ? `<div>About creator: ${esc(p.profile_desc)}</div>` : ''}
      `;
    }
  } catch {}
}

function switchPay(tab) {
  ['wallet', 'x402', 'fiat'].forEach(t => {
    const panel = document.getElementById('pay-' + t);
    if (panel) panel.classList.toggle('d-none', t !== tab);
  });
  document.querySelectorAll('#payTabs .nav-link').forEach(b => b.classList.toggle('active', b.dataset.pay === tab));
}

async function payWallet() {
  const alertBox = document.getElementById('payAlert');
  alertBox.className = 'd-none';
  try {
    const j = await fetch('/api/wallet/pay', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ video_id: VIDEO_ID, ref_code: REF || null })
    }).then(r => r.json());
    if (!j.ok) {
      showPayAlert('danger', 'Failed: ' + (j.error || 'unknown'));
      return;
    }
    showPayAlert('success', j.message || 'Payment successful. Reloading...');
    setTimeout(() => location.reload(), 1200);
  } catch (err) {
    showPayAlert('danger', 'Error: ' + err.message);
  }
}

// ---------------------------------------------------------------------------
// x402 onchain payment (MetaMask / EIP-1193 wallet + X402Splitter contract)
// ---------------------------------------------------------------------------
const ETHERS_URL = 'https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js';
const X402_ABI = [
  'function payNativeSigned(bytes32 invoiceUid, address creator, uint16 creatorBp, string videoId, uint256 minAmountWei, uint256 deadline, uint8 v, bytes32 r, bytes32 s) payable',
  'function payERC20Signed(bytes32 invoiceUid, address token, uint256 amountWei, address creator, uint16 creatorBp, string videoId, uint256 minAmountWei, uint256 deadline, uint8 v, bytes32 r, bytes32 s)'
];
const ERC20_ABI = [
  'function allowance(address owner, address spender) view returns (uint256)',
  'function approve(address spender, uint256 amount) returns (bool)',
  'function balanceOf(address account) view returns (uint256)'
];
const X402_PENDING_KEY = 'x402_pending_' + VIDEO_ID;
let ethersLoading = null;
let x402Busy = false;
// Last onchain payment awaiting server confirmation (never inlined into HTML).
let lastX402 = null;

function loadEthers() {
  if (window.ethers) return Promise.resolve(window.ethers);
  if (ethersLoading) return ethersLoading;
  ethersLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = ETHERS_URL;
    s.crossOrigin = 'anonymous';
    s.onload = () => window.ethers ? resolve(window.ethers) : reject(new Error('ethers failed to load'));
    s.onerror = () => { ethersLoading = null; reject(new Error('could not load ethers library')); };
    document.head.appendChild(s);
  });
  return ethersLoading;
}

function selectedX402Token() {
  const sel = document.getElementById('x402Token');
  if (!sel) return null;
  return paymentOptions?.x402?.tokens?.[parseInt(sel.value, 10)] || null;
}

function updateX402Amount() {
  const el = document.getElementById('x402Amount');
  if (!el) return;
  const token = selectedX402Token();
  el.textContent = token ? (token.amount_display || `${paymentOptions.price_display || ''} in ${token.symbol}`) : '-';
}

function x402Status(html) {
  const box = document.getElementById('x402Instructions');
  if (!box) return;
  box.classList.remove('d-none');
  box.innerHTML = html;
}

function walletErrorMessage(err) {
  if (err?.code === 4001 || err?.code === 'ACTION_REJECTED' || err?.info?.error?.code === 4001) return 'You rejected the request in your wallet.';
  return err?.shortMessage || err?.reason || err?.message || String(err);
}

async function connectWallet() {
  if (!window.ethereum) {
    showPayAlert('warning', 'No browser wallet detected. Install MetaMask (or a compatible EVM wallet) and reload this page.');
    return null;
  }
  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    const account = accounts?.[0];
    if (!account) throw new Error('no account selected');
    document.getElementById('x402Payer').value = account;
    return account;
  } catch (err) {
    showPayAlert('danger', 'Wallet connection failed: ' + walletErrorMessage(err));
    return null;
  }
}

async function ensureChain(chainId) {
  const hex = '0x' + Number(chainId).toString(16);
  const current = await window.ethereum.request({ method: 'eth_chainId' });
  if (String(current).toLowerCase() === hex) return;
  try {
    await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: hex }] });
  } catch (err) {
    if (err?.code === 4902) {
      throw new Error(`Network ${chainId} is not added in your wallet. Add it first, then try again.`);
    }
    throw err;
  }
}

async function payX402() {
  if (x402Busy) return;
  const token = selectedX402Token();
  if (!token) { showPayAlert('danger', 'Token configuration not found.'); return; }
  if (!window.ethereum) { showPayAlert('warning', 'No browser wallet detected. Install MetaMask (or a compatible EVM wallet) and reload this page.'); return; }

  const btn = document.getElementById('x402PayBtn');
  x402Busy = true;
  if (btn) btn.disabled = true;
  try {
    const ethers = await loadEthers();
    const payer = await connectWallet();
    if (!payer) return;

    x402Status('Switching wallet network...');
    await ensureChain(token.chain_id);

    x402Status('Creating signed invoice...');
    const inv = await fetch('/api/pay/x402/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        video_id: VIDEO_ID,
        chain_id: token.chain_id,
        symbol: token.symbol,
        token_address: token.erc20 || null,
        payer_address: payer,
        ref_code: REF || null
      })
    }).then(r => r.json());
    if (!inv.ok) throw new Error(inv.error || 'could not create invoice');

    const deadlineMs = Number(inv.deadline) * 1000;
    const isNative = !inv.token_address;
    x402Status(`
      <div><strong>Invoice:</strong> <code>${esc(inv.invoice_uid)}</code></div>
      <div><strong>Contract:</strong> <code>${esc(inv.x402_contract)}</code></div>
      <div><strong>Creator wallet:</strong> <code>${esc(inv.creator_wallet)}</code></div>
      <div><strong>Amount:</strong> ${esc(token.amount_display || inv.amount_wei + ' base units')} (${esc(inv.symbol)}, chain ${esc(inv.chain_id)})</div>
      <div><strong>Split:</strong> creator ${(Number(inv.split_creator_bp) / 100).toFixed(2)}% / platform ${(Number(inv.split_admin_bp) / 100).toFixed(2)}%</div>
      <div><strong>Valid until:</strong> ${esc(new Date(deadlineMs).toLocaleString())}</div>
      <div class="mt-2 text-body-secondary">Check that the contract address above matches the one published by the platform before confirming in your wallet.</div>
    `);

    const provider = new ethers.BrowserProvider(window.ethereum);
    const signer = await provider.getSigner();
    if ((await signer.getAddress()).toLowerCase() !== payer.toLowerCase()) {
      throw new Error('The active wallet account changed. Please try again.');
    }
    const contract = new ethers.Contract(inv.x402_contract, X402_ABI, signer);
    const amount = BigInt(inv.amount_wei);

    let tx;
    let approved = false;
    if (isNative) {
      const bal = await provider.getBalance(payer);
      if (bal < amount) throw new Error(`Insufficient ${inv.symbol} balance for this payment (plus gas).`);
      showPayAlert('info', 'Confirm the payment in your wallet...');
      tx = await contract.payNativeSigned(
        inv.invoice_uid_bytes32, inv.creator_wallet, inv.split_creator_bp, inv.video_id,
        inv.min_amount_wei, inv.deadline, inv.v, inv.r, inv.s,
        { value: amount }
      );
    } else {
      const erc20 = new ethers.Contract(inv.token_address, ERC20_ABI, signer);
      const bal = await erc20.balanceOf(payer);
      if (bal < amount) throw new Error(`Insufficient ${inv.symbol} balance for this payment.`);
      const allowance = await erc20.allowance(payer, inv.x402_contract);
      if (allowance < amount) {
        // Approve exactly the invoice amount (never an unlimited allowance).
        showPayAlert('info', `Step 1 of 2: approve ${inv.symbol} spending in your wallet...`);
        const approveTx = await erc20.approve(inv.x402_contract, amount);
        await approveTx.wait(1);
        approved = true;
      }
      if (Date.now() > deadlineMs - 15000) throw new Error('Invoice is about to expire. Please start again.');
      showPayAlert('info', approved ? 'Step 2 of 2: confirm the payment in your wallet...' : 'Confirm the payment in your wallet...');
      tx = await contract.payERC20Signed(
        inv.invoice_uid_bytes32, inv.token_address, inv.amount_wei, inv.creator_wallet,
        inv.split_creator_bp, inv.video_id, inv.min_amount_wei, inv.deadline, inv.v, inv.r, inv.s
      );
    }

    // Remember the pending payment so it can still be confirmed after a reload.
    try { sessionStorage.setItem(X402_PENDING_KEY, JSON.stringify({ invoice_uid: inv.invoice_uid, tx_hash: tx.hash })); } catch {}
    showPayAlert('info', 'Transaction sent. Waiting for confirmation onchain...');
    const receipt = await tx.wait(1);
    if (!receipt || receipt.status !== 1) throw new Error('Transaction reverted onchain.');

    await confirmX402(inv.invoice_uid, tx.hash);
  } catch (err) {
    showPayAlert('danger', 'Payment failed: ' + walletErrorMessage(err));
  } finally {
    x402Busy = false;
    if (btn) btn.disabled = false;
  }
}

function retryLastX402() {
  if (lastX402) confirmX402(lastX402.invoice_uid, lastX402.tx_hash);
}

async function confirmX402(invoiceUid, txHash, attempts = 4) {
  lastX402 = { invoice_uid: invoiceUid, tx_hash: txHash };
  for (let i = 0; i < attempts; i++) {
    let j;
    try {
      j = await fetch('/api/pay/x402/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ invoice_uid: invoiceUid, tx_hash: txHash })
      }).then(r => r.json());
    } catch (err) {
      j = { ok: false, error: err.message };
    }
    if (j.ok) {
      try { sessionStorage.removeItem(X402_PENDING_KEY); } catch {}
      showPayAlert('success', 'Payment confirmed. Unlocking video...');
      setTimeout(() => location.reload(), 1200);
      return true;
    }
    if (j.underpaid) {
      showPayAlert('danger', (j.message || 'Payment below required amount.') + ' Missing: ' + j.missing_wei + ' base units. Contact support with your transaction hash.');
      return false;
    }
    // The server's RPC node may lag behind the wallet's node; retry a few times.
    if (i < attempts - 1) {
      await new Promise(r => setTimeout(r, 4000));
    } else {
      x402Status(`
        <div>Your transaction was sent but the server could not confirm it yet.</div>
        <div><strong>Tx hash:</strong> <code>${esc(txHash)}</code></div>
        <div class="text-danger">${esc(j.error || 'unknown error')}</div>
        <button class="btn btn-sm btn-outline-primary mt-2" onclick="retryLastX402()">Try confirmation again</button>
      `);
      showPayAlert('warning', 'Confirmation pending. Keep your transaction hash; you can retry confirmation below or contact support.');
    }
  }
  return false;
}

function resumePendingX402() {
  let pending = null;
  try { pending = JSON.parse(sessionStorage.getItem(X402_PENDING_KEY) || 'null'); } catch {}
  if (!pending || !/^[A-Za-z0-9_-]{1,80}$/.test(pending.invoice_uid || '') || !/^0x[0-9a-fA-F]{64}$/.test(pending.tx_hash || '')) return;
  if (paymentOptions?.already_purchased) {
    try { sessionStorage.removeItem(X402_PENDING_KEY); } catch {}
    return;
  }
  lastX402 = { invoice_uid: pending.invoice_uid, tx_hash: pending.tx_hash };
  x402Status(`
    <div>A crypto payment from this browser is waiting for confirmation.</div>
    <div><strong>Tx hash:</strong> <code>${esc(pending.tx_hash)}</code></div>
    <button class="btn btn-sm btn-outline-primary mt-2" onclick="retryLastX402()">Confirm payment</button>
  `);
}

async function startProviderPayment(provider) {
  try {
    const j = await fetch(`/api/pay/${encodeURIComponent(provider)}/start`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        user_id: currentUser?.id || '',
        video_id: VIDEO_ID,
        amount_cents: currentVideo.price_cents || 0,
        currency: 'USD',
        buyer_email: currentUser?.email || null,
        affiliate_ref: REF || null,
        success_url: location.href,
        cancel_url: location.href
      })
    }).then(r => r.json());
    if (!j.ok) {
      showPayAlert('danger', 'Failed: ' + (j.error || 'unknown'));
      return;
    }
    if (j.payment_url) {
      location.href = j.payment_url;
      return;
    }
    showPayAlert('success', 'Invoice created: ' + (j.invoice_uid || j.invoice_id || 'ready'));
  } catch (err) {
    showPayAlert('danger', 'Error: ' + err.message);
  }
}
