name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust-check:
    name: Format, check, and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ppv_stream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ppv_stream_test
      SQLX_OFFLINE: false
      RUST_BACKTRACE: 1
      ADMIN_BOOTSTRAP_TOKEN: ci-token
      SESSION_SECRET: ci-session-secret
      PAYMENT_PLUGINS: paypal,stripe,midtrans,xendit
      PAYMENT_DEFAULT_PROVIDER: midtrans

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Apply SQL and migration files when available
        run: bash scripts/apply-sql.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

  smoke-run:
    name: Smoke run (start app + HTTP checks)
    runs-on: ubuntu-latest
    needs: rust-check

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ppv_stream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Schema for the sqlx compile-time checks.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ppv_stream_test
      # Empty database the app migrates by itself at startup.
      SMOKE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ppv_smoke
      SMOKE_LOG: smoke-server.log
      SQLX_OFFLINE: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Apply SQL and migration files for compile-time checks
        run: bash scripts/apply-sql.sh

      - name: Build server binary
        run: cargo build --locked --bin ppv_stream

      - name: Create empty smoke database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE ppv_smoke"

      - name: Run smoke test
        run: bash scripts/smoke-test.sh target/debug/ppv_stream

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-server-log
          path: smoke-server.log
          retention-days: 7
          if-no-files-found: ignore
